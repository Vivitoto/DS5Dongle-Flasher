<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DS5Dongle 桌面烧录器</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">🎮</div>
        <div>
          <h1>DS5Dongle 桌面烧录器</h1>
          <div class="chip-label">内置 Web Serial 烧录 · 直连串口</div>
        </div>
      </div>
      <div class="status" aria-live="polite">
        <span id="statusDot" class="status-dot" data-status="idle"></span>
        <span id="statusText">未连接</span>
      </div>
    </header>

    <main>
      <div id="supportNotice" class="support-notice" hidden>
        当前环境不支持 Web Serial。请使用桌面版 Electron 启动。
      </div>

      <div class="workspace">
        <section class="panel">
          <div class="panel-body">
            <h2 class="panel-title">固件版本</h2>
            <div id="releaseList" class="release-list" aria-live="polite"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-body">
            <h2 class="panel-title">设备</h2>
            <div class="serial-actions">
              <button id="connectButton" class="button button-primary" type="button">连接串口</button>
              <button id="disconnectButton" class="button" type="button" disabled>断开</button>
            </div>

            <div class="actions">
              <button id="loadLatestButton" class="button button-primary" type="button">连接并烧录最新 release</button>
              <button id="flashButton" class="button button-primary" type="button" disabled>开始烧录</button>
              <button id="cancelButton" class="button button-danger" type="button" hidden>停止</button>
            </div>

            <div class="settings">
              <label class="setting-row">
                <span class="setting-copy"><strong>芯片</strong><span>留空时由 BootROM 自动检测</span></span>
                <select id="chipSelect" class="chip-select">
                  <option value="">自动检测</option>
                  <option value="bl602">BL602</option>
                  <option value="bl616">BL616</option>
                  <option value="bl616cl">BL616CL</option>
                </select>
              </label>
              <label class="setting-row">
                <span class="setting-copy"><strong>自动进入 BootROM</strong><span>DTR / RTS 控制 BOOT 和 RESET</span></span>
                <span class="switch"><input id="autoReset" type="checkbox" checked><span class="switch-track"></span></span>
              </label>
              <label class="setting-row">
                <span class="setting-copy"><strong>完成后通过 RTS 运行</strong><span>校验通过后自动复位芯片</span></span>
                <span class="switch"><input id="runAfterFlash" type="checkbox" checked><span class="switch-track"></span></span>
              </label>
            </div>

            <div class="drop-zone" id="dropZone">
              <input id="binFile" class="file-input" type="file" accept=".bin,application/octet-stream" />
              <div>
                <div class="file-symbol">BIN</div>
                <p id="fileName" class="file-name">选择或拖入 whole.bin</p>
                <p id="fileMeta" class="file-meta">whole.bin · 写入地址 0x00000000</p>
              </div>
            </div>

            <div class="progress-wrap" aria-live="polite">
              <div class="progress-heading">
                <span id="stageText" class="stage-text">等待选择版本</span>
                <span id="progressValue" class="progress-value">0%</span>
              </div>
              <progress id="progressBar" max="100" value="0">0%</progress>
            </div>

            <div id="packageSummary" class="package-summary">
              <span class="pill subtle">未选择版本</span>
              <span class="pill subtle">串口未连接</span>
              <span class="pill subtle">STD 模式</span>
            </div>

            <div id="packageCard" class="package-card empty">
              <div class="package-head">
                <div>
                  <strong id="packageTitle">还没选包</strong>
                  <p id="packageMeta">点开某个 release 后，会自动拉取、解压并准备好文件。</p>
                </div>
              </div>
              <ul id="packageFiles" class="package-files"></ul>
            </div>
          </div>
        </section>

        <section class="panel log-panel">
          <div class="log-header">
            <h2 class="panel-title">日志</h2>
            <button id="clearLog" class="clear-log" type="button">清空</button>
          </div>
          <div id="log" class="log" role="log" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </body>
</html>
