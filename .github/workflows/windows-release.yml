name: Build and publish Windows portable EXE
# Desktop-only release flow; does not touch Docker image versions.

on:
  push:
    tags:
      - 'desktop-v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build portable EXE
        run: npm run dist:win

      - name: Generate checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist-electron -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'No EXE artifact found in dist-electron' }
          Get-FileHash $exe.FullName -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($exe.Name)" } |
            Set-Content -NoNewline dist-electron/SHA256SUMS.txt

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: DS5Dongle Flasher Desktop
          body_path: desktop/RELEASE_NOTES.md
          files: |
            desktop/dist-electron/*.exe
            desktop/dist-electron/SHA256SUMS.txt
          fail_on_unmatched_files: true
