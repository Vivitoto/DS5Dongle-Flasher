name: Build and publish Windows portable EXE
# 桌面版独立发布流程，不影响 Docker 镜像版本。

on:
  push:
    tags:
      - 'desktop-v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build portable EXE
        run: npm run dist:win

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: DS5Dongle Flasher Desktop
          body_path: desktop/RELEASE_NOTES.md
          files: |
            desktop/dist-electron/*.exe
          fail_on_unmatched_files: true
